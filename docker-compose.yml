version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dap_postgres
    restart: unless-stopped
    environment:
      # Development only. Never use these credentials for production.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev_assessment
    ports:
      - "5432:5432"
    volumes:
      - dap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dap_postgres_data:
